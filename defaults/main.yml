---
# defaults file for traefik

traefik_version: "3.1.7"
traefik_architecture: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else ansible_architecture }}"
traefik_user: "traefik"
traefik_group: "traefik"
traefik_home_dir: "/opt/traefik"
traefik_config_dir: "/etc/traefik"
traefik_data_dir: "/var/lib/traefik"
traefik_log_dir: "/var/log/traefik"
traefik_binary_path: "/usr/local/bin/traefik"
traefik_service_enabled: true
traefik_service_state: "started"

# Traefik configuration options
traefik_global_send_anonymous_usage: false
traefik_global_check_new_version: true

traefik_log_level: "ERROR"

traefik_api_dashboard: true
traefik_api_insecure: true
traefik_api_dashboard_hostname: ""

# EntryPoints
traefik_entrypoint_http_enabled: true
traefik_entrypoint_http_port: 80
traefik_entrypoint_https_enabled: true
traefik_entrypoint_https_port: 443

# Custom EntryPoints
traefik_custom_entrypoints: {}
# Example:
# traefik_custom_entrypoints:
#   ssh:
#     address: ":2222"
#   mqtt:
#     address: ":1883"
#   custom_web:
#     address: ":8080"
#     transport:
#       respondingTimeouts:
#         readTimeout: "60s"
#     http:
#       healthcheck: "/health"
#   grpc:
#     address: ":9090"
#     http:
#       healthcheck: "/grpc.health.v1.Health/Check"

# Providers
traefik_provider_docker_enabled: false
traefik_provider_docker_exposed_by_default: false
traefik_provider_docker_watch: true
traefik_provider_docker_endpoint: "unix:///var/run/docker.sock"

traefik_provider_file_enabled: true
traefik_provider_file_directory: "/etc/traefik/conf/"
traefik_provider_file_watch: true

# Services configuration
traefik_services: {}
# Example:
# traefik_services:
#   api:
#     routers:
#       api:
#         rule: "Host(`api.example.com`)"
#         service: "api"
#         entrypoints: ["https"]
#         tls:
#           certResolver: "cloudflare"
#     services:
#       api:
#         loadBalancer:
#           servers:
#             - url: "http://192.168.1.100:3000"
#             - url: "http://192.168.1.101:3000"
#           healthCheck:
#             path: "/health"
#             interval: "10s"
#   web:
#     routers:
#       web:
#         rule: "Host(`example.com`) || Host(`www.example.com`)"
#         service: "web"
#         entrypoints: ["http", "https"]
#         middlewares: ["redirect-to-https"]
#         tls:
#           certResolver: "cloudflare"
#     services:
#       web:
#         loadBalancer:
#           servers:
#             - url: "http://192.168.1.200:80"
#     middlewares:
#       redirect-to-https:
#         redirectScheme:
#           scheme: "https"
#           permanent: true

# Certificate Resolvers
traefik_certificate_resolvers_enabled: true
traefik_certificate_resolvers:
  cloudflare:
    email: "email@example.com"
    storage: "/certs/acme.json"
    ca_server: "https://acme-v02.api.letsencrypt.org/directory"
    dns_challenge:
      provider: "cloudflare"
      resolvers:
        - "1.1.1.1:53"
        - "8.8.8.8:53"
